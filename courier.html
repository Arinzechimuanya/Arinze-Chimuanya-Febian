    <title>HOME</title>
    <style>
        body{
            margin: 0;
            margin-bottom: 200px;
            padding-left: 80px;
            
        }
        .header{
            display: flex;
            flex-direction: row;
            justify-content: space-around;
            align-items: center;
            position: fixed;
            top: 0;
            right: 0;
            left: 0;
            background-color: rgb(255, 255, 255);
           
        }
        .left-section{
            width: 300px;
        }
        .image-left{
            height: 40px;
        }
        button{
            background-color: rgb(255, 255, 255);
            border: 0;
            cursor: pointer;
            
        }
        p{
            cursor: default;
        }
        .login-box{
            display: inline-block;
        }
        .username{
            margin-bottom: 20px;
            border: 1px solid rgb(59, 55, 55);
            height: 30px;
            border-radius: 13px;
            width: 250px;
            padding-left: 10px;
            border-radius: 13px;
        }
        .container{
        display: inline-block;

        border: 1px solid rgba(233, 233, 233, 0.2);
        }
        .courier-name{
            font-family: Arial,;
            font-size: 28px;
            width: 300px;
        }
        .password{
            border: 1px solid rgb(73, 70, 70);
            height: 30px;
            border-radius: 13px;
            width: 250px;
            padding-left: 10px;
        }
        .remember{
            padding-right: 130px;
        }
        .box-check{
                 display: flex;
            flex-direction: row;
            justify-content: space-between;
        }
        .enter-button{
            background-color: blue;
            width: 200px;
            color: white;
            height: 30px;
            border-radius: 50px;
        }
        .account{
            display: flex;

            justify-content: space-between;
            align-items: center;
        }
        .home-images{
            margin-right: 100px;
        }
        .home-button:hover{
            background-color: rgb(245, 245, 245);
        }
        .tracking-button:hover{
            background-color: rgb(245, 245, 245);
        } .register-button:hover{
            background-color: rgb(245, 245, 245);
        }
        
        .agents-p{
            text-align:end;
            display: inline-block;
            position: fixed;
            bottom: 0;
        }
        .agents{
            background-color: red;
            color: white;
            margin-bottom: 0;
            position: fixed;
            bottom: 0;
        }

        .show{
            margin-right: 200px;
        }
           
        .sidebar{
            
             position: fixed;
            left: 0;
            top: 0;
            bottom: 0; 
            width: fit-content;
            border: 1px solid rgba(240, 240, 240, 0.904);
            cursor: default;
            z-index: 100;
            overflow: hidden;
            
          
        }
        .sidebar div{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-bottom: 50px;
            color: black;

        }
        .x{
            position: absolute;
            right: 0;
            top: 0;
            display: block;
            color: black;
        }
        .sidebar div:hover{
            background-color:  rgb(250, 250, 250);
            opacity: 1s;
        }
        
    </style>
</head>
